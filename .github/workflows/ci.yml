name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev,anthropic]"
      - run: ruff check ai_oncall tests
      - run: ruff format --check ai_oncall tests
      - run: mypy --strict --ignore-missing-imports ai_oncall
      - name: pytest
        env:
          AI_ONCALL_DISABLE_WORKER: "1"
        run: pytest --cov=ai_oncall --cov-report=term-missing
      - name: eval harness regression gate
        env:
          AI_ONCALL_DISABLE_WORKER: "1"
        run: make eval

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm run build
