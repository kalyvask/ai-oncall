name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: ruff check ai_oncall tests
      - run: ruff format --check ai_oncall tests
      - run: mypy --strict --ignore-missing-imports ai_oncall
      - run: pytest --cov=ai_oncall --cov-report=term-missing
