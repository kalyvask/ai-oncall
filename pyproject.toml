[project]
name = "ai-oncall"
version = "0.1.0"
description = "Diagnoses production incidents using an LLM. See docs/BRIEF.md."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "jsonschema>=4.22",
  "referencing>=0.35",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "duckdb>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]
anthropic = ["anthropic>=0.34"]
eval-embeddings = ["sentence-transformers>=2.7"]

[project.scripts]
"ai-oncall" = "ai_oncall.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
